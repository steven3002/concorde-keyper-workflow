services:
  bot-api:
    image: ${NODE_IMAGE}
    working_dir: /app
    command: ["node", "doubles/bot-api/server.ts"]
    volumes:
      - ./doubles/bot-api:/app/doubles/bot-api:ro
    networks:
      - egress

  model-upstream:
    image: ${NODE_IMAGE}
    working_dir: /app
    command: ["node", "doubles/model-upstream/server.ts"]
    volumes:
      - ./doubles/model-upstream:/app/doubles/model-upstream:ro
    networks:
      - egress

  metrics-fixture:
    image: ${NODE_IMAGE}
    working_dir: /app
    command: ["node", "doubles/metrics-fixture/server.ts"]
    volumes:
      - ./doubles/metrics-fixture:/app/doubles/metrics-fixture:ro
    networks:
      - egress

networks:
  egress:
    internal: true
